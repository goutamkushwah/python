<!DOCTYPE html>
<html lang="en">
<head>
    <title>PyScript Calculator</title>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- PyScript -->
    <link rel="stylesheet"
          href="https://pyscript.net/releases/2026.3.1/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2026.3.1/core.js">
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="box">

    <h1>Calculator</h1>

    <input type="number"
           id="num1"
           placeholder="First Number">

    <input type="number"
           id="num2"
           placeholder="Second Number">

    <div class="buttons">
        <button id="addBtn">+</button>
        <button id="subBtn">-</button>
        <button id="mulBtn">*</button>
        <button id="divBtn">/</button>
    </div>

    <h2 id="result">Result:</h2>

</div>

<!-- Python File -->
<py-script src="main.py"></py-script>

</body>
</html>
