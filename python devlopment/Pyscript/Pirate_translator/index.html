<!DOCTYPE html>
<html lang="en">
<head>
    <title>Pirate Translator</title>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- PyScript -->
    <link rel="stylesheet"
          href="https://pyscript.net/releases/2026.3.1/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2026.3.1/core.js">
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="box">

    <h1>🏴‍☠️ Pirate Translator</h1>

    <textarea id="inputText"
              placeholder="Enter English text"></textarea>

    <button id="translateBtn">
        Translate
    </button>

    <h2 id="output">
        Pirate text will appear here...
    </h2>

</div>

<!-- Python -->
<py-script src="main.py"></py-script>

</body>
</html>
